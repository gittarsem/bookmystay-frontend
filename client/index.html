<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>BookMyStay — Luxury Hotel Booking</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
    rel="stylesheet"
  />

  <!-- =====================================================
       BOOKMYSTAY INITIAL LOADER
       This appears BEFORE React loads.
  ====================================================== -->

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
    }

    #bookmystay-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
    }

    #bookmystay-loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .bookmystay-loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    /* =====================================================
       HOTEL ICON
    ====================================================== */

    .hotel-icon-wrapper {
      position: relative;

      width: 100px;
      height: 100px;

      display: flex;
      align-items: center;
      justify-content: center;

      animation: hotel-float 1.8s ease-in-out infinite;
    }

    .hotel-icon {
      width: 68px;
      height: 68px;

      fill: none;
      stroke: #b88a5a;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =====================================================
       HOTEL WINDOWS
    ====================================================== */

    .window {
      fill: #b88a5a;

      transform-box: fill-box;
      transform-origin: center;

      animation: window-light 1.8s ease-in-out infinite;
    }

    .window-1 {
      animation-delay: 0s;
    }

    .window-2 {
      animation-delay: 0.2s;
    }

    .window-3 {
      animation-delay: 0.4s;
    }

    .window-4 {
      animation-delay: 0.6s;
    }

    .window-5 {
      animation-delay: 0.8s;
    }

    .window-6 {
      animation-delay: 1s;
    }

    /* =====================================================
       SPARKLES
    ====================================================== */

    .sparkle {
      position: absolute;

      color: #b88a5a;

      opacity: 0.3;

      animation: sparkle-float 2s ease-in-out infinite;
    }

    .sparkle-left {
      left: 5px;
      top: 18px;

      width: 16px;
      height: 16px;
    }

    .sparkle-right {
      right: 4px;
      top: 30px;

      width: 13px;
      height: 13px;

      animation-delay: 0.7s;
    }

    /* =====================================================
       SHADOW
    ====================================================== */

    .hotel-shadow {
      position: absolute;

      bottom: 3px;
      left: 50%;

      width: 54px;
      height: 7px;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.12);

      filter: blur(3px);

      transform: translateX(-50%);

      animation: shadow-pulse 1.8s ease-in-out infinite;
    }

    /* =====================================================
       BRAND
    ====================================================== */

    .bookmystay-brand {
      margin-top: 14px;

      font-family:
        "DM Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 20px;
      font-weight: 600;

      letter-spacing: 0.18em;

      color: #222222;
    }

    .bookmystay-message {
      margin-top: 8px;

      font-family:
        "DM Sans",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      font-size: 14px;

      color: #777777;
    }

    /* =====================================================
       LOADING DOTS
    ====================================================== */

    .loading-dots {
      display: flex;
      align-items: center;

      gap: 6px;

      margin-top: 18px;
    }

    .loading-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #b88a5a;

      animation: dot-pulse 1.4s ease-in-out infinite;
    }

    .loading-dot:nth-child(1) {
      animation-delay: 0s;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* =====================================================
       ANIMATIONS
    ====================================================== */

    @keyframes hotel-float {
      0%,
      100% {
        transform: translateY(3px);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes window-light {
      0%,
      100% {
        opacity: 0.25;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes sparkle-float {
      0%,
      100% {
        opacity: 0.2;
        transform: translateY(2px) scale(0.8);
      }

      50% {
        opacity: 1;
        transform: translateY(-5px) scale(1);
      }
    }

    @keyframes shadow-pulse {
      0%,
      100% {
        opacity: 0.16;
        transform: translateX(-50%) scaleX(1);
      }

      50% {
        opacity: 0.07;
        transform: translateX(-50%) scaleX(0.7);
      }
    }

    @keyframes dot-pulse {
      0%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    /* =====================================================
       DARK MODE
    ====================================================== */

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f0f0f;
      }

      #bookmystay-loader {
        background: #0f0f0f;
      }

      .bookmystay-brand {
        color: #f5f5f5;
      }

      .bookmystay-message {
        color: #999999;
      }
    }

    /* =====================================================
       REDUCED MOTION
    ====================================================== */

    @media (prefers-reduced-motion: reduce) {
      .hotel-icon-wrapper,
      .window,
      .sparkle,
      .hotel-shadow,
      .loading-dot {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       BOOKMYSTAY BROWSER LOADER

       This is intentionally outside React.

       The browser can display this immediately while:
       - React JavaScript is downloading
       - Vite bundle is loading
       - React is initializing
       - The application is mounting
  ====================================================== -->

  <div id="bookmystay-loader">

    <div class="bookmystay-loader-content">

      <!-- Hotel icon -->
      <div class="hotel-icon-wrapper">

        <!-- Left sparkle -->
        <svg
          class="sparkle sparkle-left"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z"
          />
        </svg>

        <!-- Right sparkle -->
        <svg
          class="sparkle sparkle-right"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path
            d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z"
          />
        </svg>

        <!-- Shadow -->
        <div class="hotel-shadow"></div>

        <!-- Hotel -->
        <svg
          class="hotel-icon"
          viewBox="0 0 64 64"
          aria-hidden="true"
        >

          <!-- Building -->
          <path
            d="M12 56V18C12 15.8 13.8 14 16 14H48C50.2 14 52 15.8 52 18V56"
          />

          <!-- Ground -->
          <path d="M8 56H56" />

          <!-- Entrance -->
          <path
            d="M27 56V44C27 42.3 28.3 41 30 41H34C35.7 41 37 42.3 37 44V56"
          />

          <!-- Windows -->
          <rect
            class="window window-1"
            x="19"
            y="21"
            width="5"
            height="5"
            rx="0.7"
            stroke="none"
          />

          <rect
            class="window window-2"
            x="29.5"
            y="21"
            width="5"
            height="5"
            rx="0.7"
            stroke="none"
          />

          <rect
            class="window window-3"
            x="40"
            y="21"
            width="5"
            height="5"
            rx="0.7"
            stroke="none"
          />

          <rect
            class="window window-4"
            x="19"
            y="30"
            width="5"
            height="5"
            rx="0.7"
            stroke="none"
          />

          <rect
            class="window window-5"
            x="29.5"
            y="30"
            width="5"
            height="5"
            rx="0.7"
            stroke="none"
          />

          <rect
            class="window window-6"
            x="40"
            y="30"
            width="5"
            height="5"
            rx="0.7"
            stroke="none"
          />

        </svg>
      </div>

      <!-- Brand -->
      <div class="bookmystay-brand">
        BOOKMYSTAY
      </div>

      <!-- Message -->
      <div class="bookmystay-message">
        Preparing your stay...
      </div>

      <!-- Dots -->
      <div class="loading-dots">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>

    </div>

  </div>

  <!-- =====================================================
       REACT APPLICATION
  ====================================================== -->

  <div id="root"></div>

  <!-- React -->
  <script type="module" src="/src/main.tsx"></script>

  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</body>

</html>
